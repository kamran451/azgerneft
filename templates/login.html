<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Admin Giriş - AZGERNEFT</title>
    <style>
        body { background: #0b1524; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1c2a3a; padding: 30px; border-radius: 10px; width: 320px; border: 1px solid #dfc27c; }
        h2 { color: #dfc27c; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #3a506b; background: #0b1524; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #dfc27c; color: #0b1524; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
        .error { color: #ff6b6b; font-size: 13px; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Admin Girişi</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="İstifadəçi adı" required>
            <input type="password" name="password" placeholder="Şifrə" required>
            <button type="submit">Daxil ol</button>
        </form>
    </div>
</body>
</html>
