<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin İdarə Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0b131e; color: white; padding: 15px; }
        .container { max-width: 900px; margin: auto; }
        .box { background: #131f2e; padding: 20px; border-radius: 10px; border: 1px solid #dfc27c; margin-bottom: 20px; }
        h2, h3 { color: #dfc27c; margin-bottom: 12px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        input { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0b131e; color: white; width: 100%; }
        .btn-gps { background: #eab308; color: black; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; grid-column: 1 / -1; }
        .btn-add { background: #22c55e; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; grid-column: 1 / -1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
        th { background: #1a293b; color: #dfc27c; }
        .btn-edit { background: #3b82f6; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .edit-form { display: none; background: #1a293b; padding: 10px; margin-top: 5px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>🛠 Admin İdarə Paneli</h2>
            <a href="/logout" style="color: #ef4444; text-decoration: none; font-weight: bold;">Çıxış Et</a>
        </div>

        <!-- YENİ QUYU ƏLAVƏ ET FAYLI -->
        <div class="box">
            <h3>Yeni Quyu Əlavə Et</h3>
            <form action="/elave-et" method="POST" class="form-grid">
                <input type="text" name="quyu_no" placeholder="Quyu № (Məs: N70)" required>
                <input type="text" id="lat" name="lat" placeholder="Enlik (Latitude)" required>
                <input type="text" id="lon" name="lon" placeholder="Uzunluq (Longitude)" required>
                <input type="text" name="meden" placeholder="Mədən № (Məs: 1-ci mədən)">
                <input type="text" name="sahe" placeholder="Sahə adı (Məs: Siyəzən)">
                <input type="text" name="telefon" placeholder="Əlaqə Nömrəsi">
                <input type="text" name="qeyd" placeholder="Qeyd">
                
                <button type="button" class="btn-gps" onclick="getLocation()">🎯 GPS ilə Qunun Yanında Dəqiq Yeri Götür</button>
                <button type="submit" class="btn-add">➕ Quyunu Yadda Saxla</button>
            </form>
        </div>

        <!-- MÖVCUD QUYULAR VƏ REDAKTƏ -->
        <div class="box">
            <h3>Mövcud Quyular və İdarəetmə</h3>
            <div style="overflow-x: auto;">
                <table>
                    <tr>
                        <th>Quyu №</th>
                        <th>Mədən / Sahə</th>
                        <th>Koordinatlar</th>
                        <th>Əlaqə</th>
                        <th>Əməliyyat</th>
                    </tr>
                    {% for well in wells %}
                    <tr>
                        <td><b>{{ well.quyu_no }}</b></td>
                        <td>{{ well.meden }}<br><small>{{ well.sahe }}</small></td>
                        <td>{{ well.lat }}, {{ well.lon }}</td>
                        <td>{{ well.telefon }}</td>
                        <td>
                            <button class="btn-edit" onclick="toggleEdit('{{ well.id }}')">✏ Redaktə</button>
                            <form action="/sil/{{ well.id }}" method="POST" style="display:inline;" onsubmit="return confirm('Silməyə əminsiniz?')">
                                <button class="btn-del" type="submit">🗑 Sil</button>
                            </form>
                        </td>
                    </tr>
                    <!-- REDAKTƏ FORMASI (GİZLİ) -->
                    <tr id="edit-row-{{ well.id }}" class="edit-form">
                        <td colspan="5">
                            <form action="/redakte/{{ well.id }}" method="POST" class="form-grid">
                                <input type="text" name="quyu_no" value="{{ well.quyu_no }}" required>
                                <input type="text" name="lat" value="{{ well.lat }}" required>
                                <input type="text" name="lon" value="{{ well.lon }}" required>
                                <input type="text" name="meden" value="{{ well.meden }}">
                                <input type="text" name="sahe" value="{{ well.sahe }}">
                                <input type="text" name="telefon" value="{{ well.telefon }}">
                                <input type="text" name="qeyd" value="{{ well.qeyd }}">
                                <button type="submit" class="btn-add" style="background: #3b82f6;">Yenilə / Yadda Saxla</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </table>
            </div>
        </div>
    </div>

    <script>
        // GPS koordinatlarını götürmək üçün funksiya
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    document.getElementById('lat').value = position.coords.latitude;
                    document.getElementById('lon').value = position.coords.longitude;
                    alert("Koordinatlar dəqiqliklə götürüldü!");
                }, function(error) {
                    alert("GPS məlumatı alına bilmədi. Xahiş olunur məkan icazəsini aktiv edin.");
                }, { enableHighAccuracy: true });
            } else {
                alert("Brauzeriniz GPS funksiyasını dəstəkləmir.");
            }
        }

        // Redaktə formasını açmaq/bağlamaq
        function toggleEdit(id) {
            var row = document.getElementById('edit-row-' + id);
            if (row.style.display === 'table-row') {
                row.style.display = 'none';
            } else {
                row.style.display = 'table-row';
            }
        }
    </script>
</body>
</html>
