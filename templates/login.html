<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Girişi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card p-4 shadow-sm mx-auto" style="max-width: 400px;">
        <h4 class="text-center mb-3">🔒 Admin Paneli</h4>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Admin Şifrəsi (Standart: 123):</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Daxil Ol</button>
        </form>
        <a href="/" class="btn btn-secondary mt-2 w-100">Geri Qayıt</a>
    </div>
</div>
</body>
</html>
