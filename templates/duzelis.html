<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quyuya Düzəliş Et - Azgerneft</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 5px; }
        .btn-green { background: #28a745; color: white; }
        .btn-gray { background: #6c757d; color: white; text-align: center; text-decoration: none; display: block; box-sizing: border-box; }
        .alert { padding: 10px; background: #f8d7da; color: #721c24; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>✏️ Quyu Məlumatlarını Düzəlt</h2>

        {% if xeta %}
            <div class="alert">{{ xeta }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Quyu Nömrəsi:</label>
                <input type="text" name="quyu_no" value="{{ quyu.quyu_no }}" required>
            </div>
            <div class="form-group">
                <label>Enlik (Latitude):</label>
                <input type="number" step="any" id="lat" name="lat" value="{{ quyu.lat }}" required>
            </div>
            <div class="form-group">
                <label>Uzunluq (Longitude):</label>
                <input type="number" step="any" id="lon" name="lon" value="{{ quyu.lon }}" required>
            </div>
            <button type="button" class="btn btn-gray" onclick="getGPS()" style="margin-bottom: 15px;">🎯 Yenidən GPS Al</button>
            <div class="form-group">
                <label>Qeyd / Əlavə Məlumat:</label>
                <textarea name="qeyd" rows="2">{{ quyu.qeyd or '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-green">Dəyişiklikləri Yadda Saxla</button>
            <a href="{{ url_for('admin') }}" class="btn btn-gray" style="margin-top: 10px;">Ləğv Et</a>
        </form>
    </div>

    <script>
        function getGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    document.getElementById("lat").value = position.coords.latitude;
                    document.getElementById("lon").value = position.coords.longitude;
                    alert("Yenilənmiş GPS koordinatları daxil edildi!");
                }, function(error) {
                    alert("GPS məlumatı alınmadı. İcazə verdiyinizdən əmin olun.");
                });
            } else {
                alert("Brauzeriniz GPS-i dəstəkləmir.");
            }
        }
    </script>
</body>
</html>
